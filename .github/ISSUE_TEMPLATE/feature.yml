name: Feature request
description: Propose a product or engineering capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem rather than only a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe behavior, API impact, alternatives, and migration concerns.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and tenancy impact
      description: Explain authorization, isolation, privacy, and abuse considerations.
