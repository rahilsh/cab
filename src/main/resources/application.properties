spring.application.name=cab-marketplace

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cab}
spring.datasource.username=${DATABASE_USERNAME:cab}
spring.datasource.password=${DATABASE_PASSWORD:cab}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read-only

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.paths-to-match=/api/v1/**
springdoc.show-actuator=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/cab}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:cab-api}

routing.osrm.base-url=${OSRM_BASE_URL:http://localhost:5000}
pricing.quote-ttl=${QUOTE_TTL:PT10M}
idempotency.ttl=${IDEMPOTENCY_TTL:PT24H}
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.requests=${RATE_LIMIT_REQUESTS:120}
rate-limit.window=${RATE_LIMIT_WINDOW:PT1M}
dispatch.search-radius-meters=${DISPATCH_SEARCH_RADIUS_METERS:5000}
dispatch.candidate-limit=${DISPATCH_CANDIDATE_LIMIT:10}
dispatch.location-max-age=${DISPATCH_LOCATION_MAX_AGE:PT2M}
dispatch.location-future-tolerance=${DISPATCH_LOCATION_FUTURE_TOLERANCE:PT30S}
dispatch.offer-ttl=${DISPATCH_OFFER_TTL:PT30S}

payments.provider=${PAYMENT_PROVIDER:fake}
payments.fake.config-reference=${FAKE_PAYMENT_CONFIG_REFERENCE:env:FAKE_PAYMENT_ACCOUNT}
payments.fake.webhook-secret-reference=${FAKE_PAYMENT_WEBHOOK_SECRET_REFERENCE:env:FAKE_PAYMENT_WEBHOOK_SECRET}
payments.fake.webhook-secret=${FAKE_PAYMENT_WEBHOOK_SECRET:local-development-only}
payments.webhook-tolerance=${PAYMENT_WEBHOOK_TOLERANCE:PT5M}
payments.platform-commission-basis-points=${PAYMENTS_PLATFORM_COMMISSION_BASIS_POINTS:1500}

webhooks.connect-timeout=${WEBHOOK_CONNECT_TIMEOUT:PT5S}
webhooks.request-timeout=${WEBHOOK_REQUEST_TIMEOUT:PT10S}
webhooks.max-attempts=${WEBHOOK_MAX_ATTEMPTS:6}
