spring.application.name=cab-marketplace

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cab}
spring.datasource.username=${DATABASE_USERNAME:cab}
spring.datasource.password=${DATABASE_PASSWORD:cab}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${MIGRATION_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/cab}}
spring.flyway.user=${MIGRATION_DATABASE_USERNAME:${DATABASE_USERNAME:cab}}
spring.flyway.password=${MIGRATION_DATABASE_PASSWORD:${DATABASE_PASSWORD:cab}}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read-only
management.info.build.enabled=true

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.paths-to-match=/api/v1/**
springdoc.show-actuator=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/cab}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:${OIDC_ISSUER_URI:http://localhost:8081/realms/cab}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:cab-api}

routing.osrm.base-url=${OSRM_BASE_URL:http://localhost:5000}
pricing.quote-ttl=${QUOTE_TTL:PT10M}
idempotency.ttl=${IDEMPOTENCY_TTL:PT24H}
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.requests=${RATE_LIMIT_REQUESTS:120}
rate-limit.window=${RATE_LIMIT_WINDOW:PT1M}
rate-limit.pre-tenant-requests=${RATE_LIMIT_PRE_TENANT_REQUESTS:240}
rate-limit.callback-requests=${RATE_LIMIT_CALLBACK_REQUESTS:60}
request-limits.max-bytes=${REQUEST_MAX_BYTES:1048576}
request-limits.callback-max-bytes=${CALLBACK_REQUEST_MAX_BYTES:262144}
server.tomcat.max-http-form-post-size=${REQUEST_MAX_BYTES:1048576}
server.tomcat.max-swallow-size=${REQUEST_MAX_BYTES:1048576}
tenancy.invitation-ttl=${TENANT_INVITATION_TTL:PT72H}
dispatch.search-radius-meters=${DISPATCH_SEARCH_RADIUS_METERS:5000}
dispatch.candidate-limit=${DISPATCH_CANDIDATE_LIMIT:10}
dispatch.location-max-age=${DISPATCH_LOCATION_MAX_AGE:PT2M}
dispatch.location-future-tolerance=${DISPATCH_LOCATION_FUTURE_TOLERANCE:PT30S}
dispatch.offer-ttl=${DISPATCH_OFFER_TTL:PT30S}
dispatch.maintenance.enabled=${DISPATCH_MAINTENANCE_ENABLED:true}
dispatch.maintenance.fixed-delay=${DISPATCH_MAINTENANCE_FIXED_DELAY:10000}
dispatch.maintenance.batch-size=${DISPATCH_MAINTENANCE_BATCH_SIZE:100}
rides.events.timeout=${RIDE_EVENTS_TIMEOUT:PT5M}
rides.events.max-per-actor=${RIDE_EVENTS_MAX_PER_ACTOR:3}
rides.events.max-per-ride=${RIDE_EVENTS_MAX_PER_RIDE:20}

payments.provider=${PAYMENT_PROVIDER:fake}
payments.config-reference=${PAYMENT_CONFIG_REFERENCE:env:FAKE_PAYMENT_ACCOUNT}
payments.webhook-secret-reference=${PAYMENT_WEBHOOK_SECRET_REFERENCE:env:FAKE_PAYMENT_WEBHOOK_SECRET}
payments.fake.webhook-secret=${FAKE_PAYMENT_WEBHOOK_SECRET:local-development-only}
payments.webhook-tolerance=${PAYMENT_WEBHOOK_TOLERANCE:PT5M}
payments.platform-commission-basis-points=${PAYMENTS_PLATFORM_COMMISSION_BASIS_POINTS:1500}

webhooks.connect-timeout=${WEBHOOK_CONNECT_TIMEOUT:PT5S}
webhooks.request-timeout=${WEBHOOK_REQUEST_TIMEOUT:PT10S}
webhooks.max-attempts=${WEBHOOK_MAX_ATTEMPTS:6}
webhooks.lease-duration=${WEBHOOK_LEASE_DURATION:PT30S}
notifications.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:6}
notifications.lease-duration=${NOTIFICATION_LEASE_DURATION:PT30S}

retention.location.enabled=${LOCATION_RETENTION_ENABLED:true}
retention.location.duration=${LOCATION_RETENTION_DURATION:P30D}
retention.location.fixed-delay=${LOCATION_RETENTION_FIXED_DELAY:3600000}
retention.location.batch-size=${LOCATION_RETENTION_BATCH_SIZE:1000}
retention.notification-attempts.duration=${NOTIFICATION_ATTEMPT_RETENTION:P90D}
retention.webhook-attempts.duration=${WEBHOOK_ATTEMPT_RETENTION:P90D}

outbox.dispatcher.enabled=${OUTBOX_DISPATCHER_ENABLED:true}
outbox.dispatcher.fixed-delay=${OUTBOX_DISPATCHER_FIXED_DELAY:1000}
outbox.dispatcher.batch-size=${OUTBOX_DISPATCHER_BATCH_SIZE:50}
outbox.dispatcher.delivery-batch-size=${OUTBOX_DELIVERY_BATCH_SIZE:50}
outbox.dispatcher.max-attempts=${OUTBOX_DISPATCHER_MAX_ATTEMPTS:10}
outbox.dispatcher.lease-duration=${OUTBOX_DISPATCHER_LEASE_DURATION:PT1M}
outbox.dispatcher.initial-backoff=${OUTBOX_DISPATCHER_INITIAL_BACKOFF:PT2S}
outbox.dispatcher.max-backoff=${OUTBOX_DISPATCHER_MAX_BACKOFF:PT5M}
