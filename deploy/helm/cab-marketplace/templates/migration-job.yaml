{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cab-marketplace.fullname" . }}-migration
  labels:
    {{- include "cab-marketplace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "cab-marketplace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.migration.serviceAccountName }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "cab-marketplace.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["java"]
          args: ["-jar", "app.jar", "--app.migration=true", "--spring.profiles.active=migration"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              value: {{ required "config.databaseUrl is required" .Values.config.databaseUrl | quote }}
            - name: FLYWAY_ENABLED
              value: "true"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                  key: {{ required "existingSecret.migrationDatabaseUsernameKey is required" .Values.existingSecret.migrationDatabaseUsernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ required "existingSecret.migrationDatabasePasswordKey is required" .Values.existingSecret.migrationDatabasePasswordKey }}
            - name: MIGRATION_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.migrationDatabaseUsernameKey }}
            - name: MIGRATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.migrationDatabasePasswordKey }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
